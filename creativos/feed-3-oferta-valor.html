<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px}
body{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;overflow:hidden;position:relative;
  background:radial-gradient(120% 90% at 20% 10%,#16b985 0%,#0f9d6b 32%,#0b6a58 68%,#093f52 100%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:44px 60px 40px}
.eyebrow{color:#12314a;background:#f5a623;font-weight:800;letter-spacing:3px;text-transform:uppercase;font-size:24px;padding:12px 28px;border-radius:100px}
h1{color:#fff;font-weight:800;font-size:66px;line-height:1;text-align:center;margin-top:22px}
h1 .hl{color:#fff5d6}
.mid{display:flex;align-items:center;gap:20px;margin-top:26px;width:100%;justify-content:center}
.checks{display:flex;flex-direction:column;gap:16px}
.crow{display:flex;align-items:center;gap:16px;color:#fff;font-size:31px;font-weight:700}
.crow .ck{flex:none;width:44px;height:44px;border-radius:50%;background:#f5a623;color:#12314a;display:grid;place-items:center;font-size:26px;font-weight:900}
.crow small{display:block;color:#bfe6d5;font-size:21px;font-weight:600}
.visual{position:relative;width:250px;height:270px;flex:none}
.visual svg{position:absolute}
.price{margin-top:40px;width:100%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:24px;padding:22px 34px;display:flex;align-items:center;justify-content:space-between}
.price .l{color:#cfe9de;font-size:26px;font-weight:700}
.price .l s{color:#ff9a9a;text-decoration-thickness:3px}
.price .big{color:#fff;font-weight:800;font-size:60px;line-height:1}
.price .big small{font-size:26px;color:#ffd98a;display:block;font-weight:700;text-align:right}
.cta{margin-top:18px;background:#fff;color:#0b7a52;font-weight:800;font-size:38px;padding:24px 60px;border-radius:100px;display:inline-flex;align-items:center;gap:16px;box-shadow:0 16px 30px rgba(0,0,0,.3)}
.arrowc{width:48px;height:48px;border-radius:50%;background:#0f9d6b;color:#fff;display:grid;place-items:center;font-size:26px}
.limit{color:#ffd98a;font-weight:800;font-size:22px;letter-spacing:1px;margin-top:12px;text-transform:uppercase}
</style></head><body>
<div class="wrap">
  <div class="eyebrow">El método completo</div>
  <h1>Todo lo que necesitás<br><span class="hl">para tu verano</span></h1>

  <div class="mid">
    <div class="checks">
      <div class="crow"><span class="ck">✓</span><div>Ebook 12 semanas<small>Comida · mente · hábitos</small></div></div>
      <div class="crow"><span class="ck">✓</span><div>30 licuados<small>Ricos y saciantes</small></div></div>
      <div class="crow"><span class="ck">✓</span><div>40 recetas fit<small>Uruguayas y fáciles</small></div></div>
      <div class="crow"><span class="ck">✓</span><div>Rutina de gym y casa<small>Explicada desde cero</small></div></div>
    </div>
    <div class="visual">
      <!-- smoothie -->
      <svg viewBox="0 0 160 220" width="150" height="206" style="left:0;top:0">
        <defs>
          <linearGradient id="sm1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5e8a"/><stop offset="1" stop-color="#e0433f"/></linearGradient>
          <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/></linearGradient>
        </defs>
        <path d="M36 66 L124 66 L112 202 Q111 210 103 210 L57 210 Q49 210 48 202 Z" fill="url(#sm1)"/>
        <path d="M36 66 L124 66 L112 202 Q111 210 103 210 L57 210 Q49 210 48 202 Z" fill="url(#gl)"/>
        <path d="M36 66 L124 66 L112 202 Q111 210 103 210 L57 210 Q49 210 48 202 Z" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".7"/>
        <ellipse cx="80" cy="66" rx="44" ry="11" fill="#ff789d"/>
        <ellipse cx="80" cy="66" rx="44" ry="11" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".7"/>
        <rect x="94" y="20" width="11" height="66" rx="5" fill="#f5a623" transform="rotate(14 100 53)"/>
        <path d="M62 52 q10 -16 22 0 q-6 16 -11 20 q-5 -4 -11 -20 Z" fill="#e0433f" stroke="#b3302c" stroke-width="1.5"/>
        <path d="M62 52 q11 -6 22 0 l-3 -8 q-8 -4 -16 0 Z" fill="#2ec39a"/>
        <path d="M52 58 q-12 -6 -18 -2 q6 10 18 6 Z" fill="#2ec39a"/>
        <rect x="52" y="90" width="8" height="90" rx="4" fill="#fff" opacity=".25"/>
      </svg>
      <!-- dumbbell -->
      <svg viewBox="0 0 220 120" width="210" height="115" style="left:40px;top:150px">
        <defs><linearGradient id="mtl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5a6e"/><stop offset=".5" stop-color="#2b3a4a"/><stop offset="1" stop-color="#1b2733"/></linearGradient></defs>
        <rect x="70" y="52" width="80" height="16" rx="8" fill="url(#mtl)"/>
        <rect x="58" y="40" width="16" height="40" rx="6" fill="url(#mtl)"/><rect x="146" y="40" width="16" height="40" rx="6" fill="url(#mtl)"/>
        <rect x="38" y="28" width="22" height="64" rx="9" fill="url(#mtl)"/><rect x="160" y="28" width="22" height="64" rx="9" fill="url(#mtl)"/>
        <rect x="30" y="34" width="12" height="52" rx="6" fill="#0f9d6b"/><rect x="178" y="34" width="12" height="52" rx="6" fill="#0f9d6b"/>
        <rect x="44" y="34" width="5" height="50" rx="2.5" fill="#fff" opacity=".25"/>
      </svg>
    </div>
  </div>

  <div class="price">
    <div class="l">Comprado por separado:<br><s>$ 1.900</s></div>
    <div class="big">$ 890<small>hoy, todo junto</small></div>
  </div>
  <div class="limit">⏳ Precio de lanzamiento</div>
  <div class="cta">Lo quiero <span class="arrowc">→</span></div>
</div>
</body></html>
