<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px}
body{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;overflow:hidden;position:relative;
  background:linear-gradient(155deg,#0c2f4a 0%,#0b6a58 60%,#0f9d6b 100%)}
.sun{position:absolute;bottom:-320px;left:50%;transform:translateX(-50%);width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,222,150,.4),transparent 60%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:90px 80px}
.eyebrow{color:#fff;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);font-weight:800;letter-spacing:4px;text-transform:uppercase;font-size:24px;padding:13px 30px;border-radius:100px}
h1{color:#fff;font-weight:800;font-size:88px;line-height:1;margin-top:34px;letter-spacing:-.02em}
h1 .hl{color:#fff5d6}
.sub{color:#eafff4;font-size:36px;font-weight:600;margin-top:28px;max-width:820px;line-height:1.3}
.mini{margin-top:46px;display:flex;gap:22px}
.chip{width:150px;height:200px;border-radius:14px;box-shadow:0 16px 30px rgba(0,0,0,.4);position:relative;overflow:hidden}
.chip .eb{position:absolute;top:14px;left:14px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.9);font-weight:800}
.chip span{position:absolute;left:14px;right:12px;bottom:14px;color:#fff;font-weight:800;font-size:23px;line-height:1.04}
.glow{position:absolute;right:-40%;top:-30%;width:120%;height:120%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 60%)}
.b-main{background:linear-gradient(150deg,#0b7a52,#16b985 70%,#f5b83d 145%)}
.b-lic{background:linear-gradient(155deg,#e8571f,#ffb347)}
.b-rec{background:linear-gradient(155deg,#0b6a8a,#25c0cf)}
.b-ent{background:linear-gradient(150deg,#0c2f4a,#0f9d6b 125%)}
.cta{margin-top:auto;background:#f5a623;color:#12314a;font-weight:800;font-size:38px;padding:28px 54px;border-radius:100px;display:inline-flex;align-items:center;gap:16px;box-shadow:0 16px 30px rgba(0,0,0,.32)}
.arrowc{width:48px;height:48px;border-radius:50%;background:#12314a;color:#fff;display:grid;place-items:center;font-size:27px}
</style></head><body>
<div class="sun"></div>
<div class="wrap">
  <div class="eyebrow">3 meses · tu mejor verano</div>
  <h1>Este verano,<br>metete al agua<br><span class="hl">sin pensarlo</span></h1>
  <div class="sub">Empezá hoy con un método real para cuidarte, moverte y sentirte cómodo con vos.</div>
  <div class="mini">
    <div class="chip b-main"><div class="glow"></div><div class="eb">Guía</div><span>12 Semanas</span></div>
    <div class="chip b-lic"><div class="glow"></div><div class="eb">Bonus</div><span>Licuados</span></div>
    <div class="chip b-rec"><div class="glow"></div><div class="eb">Bonus</div><span>Recetas</span></div>
    <div class="chip b-ent"><div class="glow"></div><div class="eb">Bonus</div><span>Entreno</span></div>
  </div>
  <div class="cta">Empezar ahora <span class="arrowc">→</span></div>
</div>
</body></html>
