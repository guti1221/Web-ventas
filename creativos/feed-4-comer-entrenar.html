<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px}
body{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;overflow:hidden;position:relative}
.half{position:absolute;top:0;bottom:0;width:50%;display:flex;flex-direction:column;align-items:center;padding:70px 40px}
.left{left:0;background:linear-gradient(160deg,#e8571f,#f5872b 60%,#ffb347)}
.right{right:0;background:linear-gradient(160deg,#0c2f4a,#124d6b 55%,#0f9d6b)}
.htag{color:#fff;font-weight:800;letter-spacing:3px;text-transform:uppercase;font-size:26px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);padding:12px 26px;border-radius:100px}
.half h2{color:#fff;font-weight:800;font-size:52px;line-height:1;text-align:center;margin-top:22px}
.half p{color:rgba(255,255,255,.92);font-size:26px;text-align:center;margin-top:14px;font-weight:600;line-height:1.3}
.art{margin-top:auto;width:100%;display:flex;justify-content:center;align-items:flex-end;gap:6px}
/* center medallion */
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
  width:340px;height:340px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#16b985,#0b7a52);
  border:10px solid #fff;box-shadow:0 24px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.center .k{color:#fff5d6;font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:22px}
.center h1{color:#fff;font-weight:800;font-size:52px;line-height:.98;margin:6px 0}
.center .cta{margin-top:10px;background:#f5a623;color:#12314a;font-weight:800;font-size:26px;padding:14px 30px;border-radius:100px}
.badge{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:6;background:#fff;color:#0b7a52;font-weight:800;font-size:26px;padding:14px 30px;border-radius:100px;box-shadow:0 10px 22px rgba(0,0,0,.3)}
</style></head><body>
<div class="half left">
  <div class="htag">Comé rico</div>
  <h2>Nutrición</h2>
  <p>Licuados y recetas<br>uruguayas fit</p>
  <div class="art">
    <svg viewBox="0 0 160 220" width="200" height="275"><defs>
      <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff9f45"/></linearGradient>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient></defs>
      <path d="M36 66 L124 66 L112 202 Q111 210 103 210 L57 210 Q49 210 48 202 Z" fill="url(#s1)"/>
      <path d="M36 66 L124 66 L112 202 Q111 210 103 210 L57 210 Q49 210 48 202 Z" fill="url(#g1)"/>
      <path d="M36 66 L124 66 L112 202 Q111 210 103 210 L57 210 Q49 210 48 202 Z" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".8"/>
      <ellipse cx="80" cy="66" rx="44" ry="11" fill="#ffe8a0"/><ellipse cx="80" cy="66" rx="44" ry="11" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".8"/>
      <rect x="94" y="18" width="11" height="66" rx="5" fill="#e8571f" transform="rotate(14 100 51)"/>
      <circle cx="70" cy="60" r="9" fill="#fff2c8" stroke="#f0dca0" stroke-width="1.5"/><circle cx="70" cy="60" r="3" fill="#f0dca0"/>
      <path d="M90 58 q12 -8 20 -3 q-5 11 -20 7 Z" fill="#2ec39a"/>
      <rect x="52" y="90" width="8" height="90" rx="4" fill="#fff" opacity=".3"/></svg>
  </div>
</div>

<div class="half right">
  <div class="htag">Entrená</div>
  <h2>Movimiento</h2>
  <p>Rutina de gym y casa<br>explicada desde cero</p>
  <div class="art">
    <!-- kettlebell -->
    <svg viewBox="0 0 160 180" width="170" height="191"><defs><radialGradient id="kb" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#3a4a5e"/><stop offset="1" stop-color="#12202c"/></radialGradient></defs>
      <path d="M56 60 Q56 26 80 26 Q104 26 104 60" fill="none" stroke="#22303f" stroke-width="14" stroke-linecap="round"/>
      <path d="M80 58 Q128 58 128 116 Q128 166 80 166 Q32 166 32 116 Q32 58 80 58 Z" fill="url(#kb)"/>
      <ellipse cx="66" cy="96" rx="14" ry="10" fill="#fff" opacity=".18"/>
      <text x="80" y="128" font-size="30" fill="#fff" font-family="Arial" font-weight="bold" text-anchor="middle" opacity=".85">12</text></svg>
    <!-- dumbbell -->
    <svg viewBox="0 0 220 120" width="220" height="120" style="margin-bottom:24px"><defs><linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5a6e"/><stop offset=".5" stop-color="#2b3a4a"/><stop offset="1" stop-color="#1b2733"/></linearGradient></defs>
      <rect x="70" y="52" width="80" height="16" rx="8" fill="url(#m1)"/>
      <rect x="58" y="40" width="16" height="40" rx="6" fill="url(#m1)"/><rect x="146" y="40" width="16" height="40" rx="6" fill="url(#m1)"/>
      <rect x="38" y="28" width="22" height="64" rx="9" fill="url(#m1)"/><rect x="160" y="28" width="22" height="64" rx="9" fill="url(#m1)"/>
      <rect x="30" y="34" width="12" height="52" rx="6" fill="#16b985"/><rect x="178" y="34" width="12" height="52" rx="6" fill="#16b985"/></svg>
  </div>
</div>

<div class="badge">El método completo</div>
<div class="center">
  <div class="k">12 semanas</div>
  <h1>Verano<br>Fit</h1>
  <div class="cta">Lo quiero →</div>
</div>
</body></html>
